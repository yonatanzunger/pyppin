[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyppin"
version = "1.0.7"
description = "Python tools collection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["threading", "stack trace", "utilities"]
authors = [{ name = "Yonatan Zunger", email = "zunger@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
]
dependencies = []

[project.urls]
Source = "https://github.com/yonatanzunger/pyppin"
Tracker = "https://github.com/yonatanzunger/pyppin/issues"
Documentation = "https://yonatanzunger.github.io/pyppin/"

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[tool.hatch.build.targets.wheel]
packages = ["pyppin"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Maps the old flake8 selection (E,F,W,B) plus isort (I). E501 is left to the
# formatter, matching the old .flake8 config. Mccabe complexity (C90) is omitted
# because the old .flake8 selected `C` but never set max-complexity, so it never
# actually fired.
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["pyppin", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
# Mirrors the old mypy config (ignore_missing_imports + strict-ish defs).
reportMissingImports = false
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportUntypedBaseClass = true
